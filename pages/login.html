<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - EducaIgual</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  
  <header class="cabecalho">
    <div class="logo">
      <a href="/pages/index.html">
      <img src="/img/Logo.svg" alt="logotipo EducaLivre">
    </a>
 </div>
  <div class="container-busca">
    <input type="text" placeholder="Encontre uma Instituição">
    <button><i class="fas fa-search"></i></button>
  </div>
  <div class="actions">
    <span>Torne-se Um Avaliador!</span>
    <button onclick="window.location.href='cadastro.html' " class="cadastro-btn">Cadastro</button>
  </div>
  <div class="menu-icon">
    <i class="fas fa-bars"></i>
  </div>
  <nav class="menu-navegacao">
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="cadastro.html">Cadastrar-se</a></li>
      <li><a href="/pages/priv.html">Política de Privacidade</a></li>
      <li><a href="/pages/Sc.html">Sobre Nós</a></li>
    </ul>
  </nav>
</header>
  <main class="content-wrapper">
    <div class="container">
      <form class="form-box">
        <h1>Login</h1>

        <div class="input-group">
          <label for="username">E-mail ou Usuário:</label>
          <input type="text" id="username" />
        </div>

        <div class="input-group">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" />
        </div>

        <div class="btn-group">
          <button class="btn" type="submit">Entrar</button>
          <button class="btn btn-secondary" type="button">Esqueci a Senha</button>
        </div>

        <p style="text-align: center; margin-top: 20px;">É novo no EducaLivre?</p>
        <a href="/pages/cadastro.html" class="btn btn-register">Cadastrar</a>
      </form>
    </div>
  </main>
 <footer class="rodape">
    <div class="rodape-conteudo">

      <p>2025 EducaLivre © Todos os direitos reservados.</p>

      <div class="rodape-links">
        <h4>Institucional</h4>
        <ul>
          <li><a href="/pages/Sc.html">Sobre nós</a></li>
          <li><a href="/pages/priv.html">Política de privacidade</a></li>
        </ul>
      </div>
      <a href="#" class="voltar-topo">
        <i class="fas fa-chevron-up"></i> Voltar ao topo
      </a>
    </div>
  </footer>
  <script src="./code.js"></script>
</body>
</html>
